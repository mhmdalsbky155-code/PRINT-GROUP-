    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const questionPage = document.getElementById('question-page');
        const successPage = document.getElementById('success-page');
        
        const typingText = document.getElementById('typing-text');
        const typingSub = document.getElementById('typing-sub');
        const mainQuestion = document.getElementById('main-question');
        const btnsContainer = document.getElementById('btns-container');

        const textToType = "مكتبة طيف";
        
        function startTypingAnimation() {
            typingText.innerHTML = ""; 
            typingText.style.width = "auto"; 
            let i = 0;
            
            function typeChar() {
                if (i < textToType.length) {
                    typingText.innerHTML += textToType.charAt(i);
                    i++;
                    setTimeout(typeChar, 150); 
                } else {
                    setTimeout(() => {
                        typingText.style.borderLeft = "none";
                        revealUI();
                    }, 500);
                }
            }
            
            typeChar();
        }

        function revealUI() {
            typingSub.classList.add('show-element');
            
            setTimeout(() => {
                mainQuestion.classList.add('show-element');
            }, 600);

            setTimeout(() => {
                btnsContainer.classList.add('show');
            }, 1200);
        }

        window.onload = () => {
            setTimeout(startTypingAnimation, 500);
        };

        function escapeMouse() {
            noBtn.style.position = 'fixed';
            
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        noBtn.addEventListener('mouseover', escapeMouse);
        
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            escapeMouse();
        });

        yesBtn.addEventListener('click', () => {
            questionPage.style.display = 'none';
            successPage.style.display = 'flex';
            
            noBtn.style.display = 'none'; 
        });

    </script>
